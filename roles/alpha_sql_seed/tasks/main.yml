---
# =====================================================================
# alpha_sql_seed — seed SecretsDb + nested vulnerable procs (M9.1-9.4) on ALPHA-SECRETS
# sqlcmd ships with SQL Server (installed by badsectorlabs.ludus_mssql). We run the
# seed locally over the WinRM connection with SQL auth (appuser is sysadmin).
# Refs: OWASP SQL Injection; CWE-89 (Improper Neutralization of Special Elements in SQL).
# =====================================================================

- name: Ensure C:\Scripts exists
  ansible.windows.win_file:
    path: "{{ alpha_sql_scripts_dir }}"
    state: directory

- name: Copy secretsdb_setup.sql to ALPHA-SECRETS
  ansible.windows.win_copy:
    src: secretsdb_setup.sql
    dest: "{{ alpha_sql_seed_remote_path }}"

# -b makes sqlcmd return a non-zero exit on a real SQL error so Ansible fails loudly.
# The DDL/DML is valid; the "vulnerability" is only at runtime through the procs.
# LoopbackLinkedServer is passed as a sqlcmd scripting variable ($(LoopbackLinkedServer)).
- name: Run seed_vuln.sql (SecretsDb, crown-jewel tables, nested vulnerable procs)
  ansible.windows.win_shell: >-
    sqlcmd -S "{{ alpha_sql_instance }}" -U "{{ alpha_sql_login }}" -P "{{ alpha_sql_password }}"
    -b -i "{{ alpha_sql_seed_remote_path }}"
    -v LoopbackLinkedServer="{{ 1 if alpha_sql_create_loopback_linked_server else 0 }}"
  register: sql_seed
  changed_when: true

- name: Plant the "database management script" the DA finds (M9.1)
  ansible.windows.win_template:
    src: db_management.ps1.j2
    dest: 'C:\Scripts\db_management.ps1'
    newline_sequence: "\r\n"
