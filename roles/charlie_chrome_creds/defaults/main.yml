---
# =============================================================================
# charlie_chrome_creds defaults
# =============================================================================
# The account whose Chrome cred is seeded is reuben (the AREUBEN-WS autologon
# user). The seeded login is the BookStack editor identity, which is an EMAIL
# (BookStack authenticates by email), so charlie_wiki_editor_email is stored as
# the Chrome "username".
#
# CRITICAL: charlie_wiki_editor_email / charlie_wiki_editor_password MUST MATCH
# the editor account created by charlie_bookstack, or the dumped cred will not
# log into the wiki. Defaults are identical in both roles.

charlie_wiki_url: "http://wiki.charlie.local"
charlie_wiki_login_url: "http://wiki.charlie.local/login"
charlie_wiki_editor_email: "reuben@charlie.local"
charlie_wiki_editor_password: "Reuben.Wiki.2025!"

# reuben (AREUBEN-WS autologon user) -- whose profile we seed.
charlie_chrome_reuben_user: reuben
charlie_chrome_reuben_domain: charlie      # NetBIOS

# staging dir for the injector + logon wrapper on the host
charlie_chrome_stage_dir: 'C:\ProgramData\ChromeSync'

# The secret is handed to reuben's logon wrapper as a machine-protected
# (DPAPI / LOCAL_MACHINE) blob so the plaintext is never written to disk. The
# wrapper decrypts it, injects the credential, self-verifies, then deletes it.
charlie_chrome_secret_file: 'profile.dat'

# install python + pycryptodome for the injector
charlie_chrome_install_python: true

# scheduled task name
charlie_chrome_task_name: "ChromeProfileSync"
