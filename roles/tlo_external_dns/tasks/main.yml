---
# =============================================================================
# tlo_external_dns — authoritative bind9 for meridianfreight.com with AXFR leak
# =============================================================================
# Idempotent; safe to re-run.

# ---------------------------------------------------------------------------
# 0. Derive <R> and this host's External IP from facts (do NOT hardcode).
# ---------------------------------------------------------------------------
- name: Gather facts
  ansible.builtin.setup:

- name: Find this host's VLAN-20 (External) IPv4 address
  ansible.builtin.shell: |
    set -o pipefail
    ip -o -4 addr show | awk '/inet 10\.[0-9]+\.20\./ {print $4; exit}'
  args:
    executable: /bin/bash
  register: tlo_dns_addr
  changed_when: false

- name: Assert we located the External address
  ansible.builtin.assert:
    that:
      - tlo_dns_addr.stdout | length > 0
    fail_msg: >-
      Could not find a 10.x.20.x address; tlo_external_dns must run on the
      External DMZ (VLAN 20). Interfaces seen: {{ ansible_interfaces | join(', ') }}
    success_msg: "External address found: {{ tlo_dns_addr.stdout }}"

- name: Derive range octet and this host's DNS IP
  ansible.builtin.set_fact:
    tlo_dns_ip: "{{ tlo_dns_addr.stdout.split('/')[0] }}"
    tlo_range_octet: "{{ tlo_dns_addr.stdout.split('.')[1] }}"

- name: Compute the VPN portal IP for the vpn.<zone> record
  ansible.builtin.set_fact:
    tlo_portal_ip: "10.{{ tlo_range_octet }}.20.{{ dns_portal_last_octet }}"

- name: Show derived DNS values
  ansible.builtin.debug:
    msg: >-
      zone={{ dns_zone }} <R>={{ tlo_range_octet }} ns1/self={{ tlo_dns_ip }}
      vpn.{{ dns_zone }}->{{ tlo_portal_ip }}

# ---------------------------------------------------------------------------
# 1. Install bind9
# ---------------------------------------------------------------------------
- name: Install bind9 and utilities
  become: true
  ansible.builtin.apt:
    name: "{{ dns_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# ---------------------------------------------------------------------------
# 2. Configuration + zone file
# ---------------------------------------------------------------------------
- name: Deploy named.conf.options (forwarders + global AXFR leak)
  become: true
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
  notify: restart bind9

- name: Deploy named.conf.local (zone declaration + AXFR leak)
  become: true
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0644"
  notify: restart bind9

- name: Deploy the meridianfreight.com zone file
  become: true
  ansible.builtin.template:
    src: db.zone.j2
    dest: "/etc/bind/db.{{ dns_zone }}"
    owner: root
    group: bind
    mode: "0644"
    # Reject a broken zone before bind ever loads it.
    validate: "named-checkzone {{ dns_zone }} %s"
  notify: restart bind9

- name: Validate the full bind configuration
  become: true
  ansible.builtin.command: named-checkconf
  changed_when: false

- name: Enable and start bind9
  become: true
  ansible.builtin.service:
    name: bind9
    enabled: true
    state: started

- name: DNS summary
  ansible.builtin.debug:
    msg:
      - "Authoritative {{ dns_zone }} on {{ tlo_dns_ip }}:53 (forwarders {{ dns_forwarders | join(', ') }})."
      - "AXFR is open to any: `dig axfr {{ dns_zone }} @{{ tlo_dns_ip }}` leaks the full zone (incl. internal 10.{{ tlo_range_octet }}.30.x hosts)."
      - "vpn.{{ dns_zone }} -> {{ tlo_portal_ip }}."
