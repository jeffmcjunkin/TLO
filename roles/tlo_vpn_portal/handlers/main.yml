---
- name: restart openvpn
  become: true
  ansible.builtin.systemd:
    name: "openvpn-server@server"
    state: restarted

- name: reload nginx
  become: true
  ansible.builtin.service:
    name: nginx
    state: reloaded

# Persist the running iptables ruleset so NAT survives a reboot.
- name: save iptables
  become: true
  ansible.builtin.command: netfilter-persistent save
  changed_when: true
