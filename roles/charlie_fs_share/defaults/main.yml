---
# =============================================================================
# charlie_fs_share defaults
# =============================================================================
charlie_fqdn: charlie.local

# --- IT$ share : Everyone/anonymous READ (pairs with the DC anon_share_access
#     GPO). Attacker enumerates it with `nxc smb FS -u '' -p ''` or
#     `smbclient -N //FS/IT$` (M2.1) and reads VPN_Setup_Notes.txt (M2.2).
charlie_it_share_name: "IT$"
charlie_it_share_path: 'C:\Shares\IT'

# --- Backups share : Domain Users READ. Reachable only after the attacker has
#     a valid domain credential (post-AS-REP), holding passwords.kdbx (M4.4).
charlie_backups_share_name: "Backups"
charlie_backups_share_path: 'C:\Shares\Backups'

# --- planted files ----------------------------------------------------------
charlie_kdbx_filename: passwords.kdbx
# Master password baked into files/passwords.kdbx by make_keepass.py. This is
# documentation only (the binary is prebuilt); to change it, regenerate the
# .kdbx (see charlie_kdbx_build_on_target below or run make_keepass.py offline).
charlie_kdbx_master_password: "sunshine1"     # present verbatim in rockyou.txt

# The username list leaked in VPN_Setup_Notes.txt. Keep in sync with the
# accounts created by charlie_ad_vulns.
charlie_leaked_usernames:
  - reuben
  - svc_helpdesk
  - helpdesk_admin
  - webed
  - Administrator
# The AS-REP-roastable service account named in the notes' "known issues" hint.
charlie_asrep_user: svc_helpdesk

# VPN flavor shown in the notes (should match the External VPN product / M1).
charlie_vpn_product: "OpenVPN"
charlie_vpn_portal: "vpn.meridianfreight.com"
charlie_vpn_internal_cidr: "10.30.0.0/24"

# --- simulated privileged victim browser (M4.2) -----------------------------
# helpdesk_admin (autologged-in on this host) habitually opens the wiki VPN
# runbook; rendering the page triggers the attacker-planted <img src=//attacker>
# -> NTLM coercion. Replaces ludus_ghosts_client (no GHOSTS server available).
charlie_enable_victim_browser: true
charlie_wiki_url: "http://wiki.charlie.local/books/it/page/vpn-runbook"
charlie_victim_user: helpdesk_admin
charlie_victim_password: "Helpdesk!Adm1n"

# Where the browse script lives. It MUST sit somewhere the (non-admin) victim's
# filtered logon token can read+execute: C:\Windows\Temp grants standard users
# create/traverse but NOT read of files owned by SYSTEM, so cmd.exe launched by
# the task could not even open the script (return code 0x80070001) -- the task
# ran but nothing happened. C:\ProgramData grants Users read by default; we also
# set an explicit ACL below to be certain.
charlie_victim_script_dir: 'C:\ProgramData\ITSupport'
charlie_victim_script_path: '{{ charlie_victim_script_dir }}\vpn_runbook_check.cmd'

# charlie-wiki is a standalone (non-domain-joined) host, so it has no A record
# in charlie.local. Pin the wiki name locally so the victim's browser resolves
# it even if the zone lacks a `wiki` record. (The proper shared fix is a `wiki`
# A record on the CHARLIE DC; this hosts entry keeps the role self-contained.)
charlie_wiki_host: wiki.charlie.local
charlie_wiki_ip: "10.3.30.21"

# --- optional on-target .kdbx rebuild (FALLBACK) ----------------------------
# Primary delivery is the prebuilt files/passwords.kdbx (win_copy). If you must
# rebuild on the host instead (e.g. after editing entries), set this true: the
# role installs Python via Chocolatey, `pip install pykeepass`, ships
# make_keepass.py, and runs it on CHARLIE-FS. Requires internet during deploy.
charlie_kdbx_build_on_target: false
