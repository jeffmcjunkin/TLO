---
# Runs on oscar-hardhat (Debian 12). Docker comes from the geerlingguy.docker dependency.
# Clones HardHat C2 and kicks off its docker build ONCE in the background (the .NET image
# build is slow, ~20-40 min); the deploy never blocks on it. HardHat comes up when the build
# finishes; validation verifies it (docker ps / curl :7096). Idempotent via a marker file.

- name: Install git
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: true

- name: Clone HardHat C2 at the pinned ref
  ansible.builtin.git:
    repo: "{{ hardhat_repo }}"
    dest: "{{ hardhat_dir }}"
    version: "{{ hardhat_version }}"
    depth: 1
    force: true

- name: Copy the teamserver compile-fix patch script
  ansible.builtin.copy:
    src: patch_teamserver.py
    dest: "{{ hardhat_dir }}/patch_teamserver.py"
    mode: "0755"

# V0.3.03-Alpha's teamserver does not compile (interface-vs-base-class type errors in
# the Ext_Implants plugin base). The patch adds the two explicit downcasts. Idempotent.
- name: Patch the teamserver so it compiles (CS1061/CS0266 in ExtImplantHandleComms_Base.cs)
  ansible.builtin.command: python3 patch_teamserver.py
  args:
    chdir: "{{ hardhat_dir }}"
  register: hardhat_patch
  changed_when: "'patched 2/2' in hardhat_patch.stdout and 'already' not in hardhat_patch.stdout"

- name: Overlay the TLO compose (exposes teamserver + client to the range)
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ hardhat_dir }}/docker-compose.yaml"

- name: Build + start HardHat C2 in the background, once (slow .NET build; log /var/log/hardhat_build.log)
  ansible.builtin.shell: |
    nohup docker compose -f docker-compose.yaml up -d --build > /var/log/hardhat_build.log 2>&1 &
    disown || true
    touch {{ hardhat_dir }}/.tlo_build_started
  args:
    chdir: "{{ hardhat_dir }}"
    creates: "{{ hardhat_dir }}/.tlo_build_started"
