---
# =====================================================================
# alpha_teamcity — install TeamCity server + a Domain-Admin build agent, ship the
# supply-chain C# project + deploy-hook patch.
#
# The NSIS /S silent install only EXTRACTS TeamCity — it does not create conf/server.xml,
# register the Windows services, or complete the first-run wizard. setup_teamcity.ps1 and
# setup_agent.ps1 do all of that unattended (service install via TeamCityService.exe, the
# /mnt maintenance wizard, EULA, super-user-token REST). Both scripts are idempotent.
# =====================================================================

# ---- 1. download + extract (silent) ----
- name: Download the TeamCity Windows installer
  ansible.windows.win_get_url:
    url: "{{ alpha_teamcity_installer_url }}"
    dest: "{{ alpha_teamcity_download_path }}"
    force: false
  register: tc_dl
  retries: 3
  delay: 15
  until: tc_dl is succeeded

- name: Check whether TeamCity is already extracted (idempotency)
  ansible.windows.win_stat:
    path: "{{ alpha_teamcity_install_dir }}\\bin\\TeamCityService.exe"
  register: tc_extracted

# NSIS: /S = silent, /D=<dir> MUST be last and unquoted. Extracts to InstallDir.
- name: Silent-extract TeamCity
  ansible.windows.win_command: >-
    {{ alpha_teamcity_download_path }} /S /D={{ alpha_teamcity_install_dir }}
  when: not tc_extracted.stat.exists
  register: tc_install

- name: Wait for extraction to finish (TeamCityService.exe present)
  ansible.windows.win_stat:
    path: "{{ alpha_teamcity_install_dir }}\\bin\\TeamCityService.exe"
  register: tc_bin
  retries: 30
  delay: 10
  until: tc_bin.stat.exists

# ---- 2. server config: plain-HTTP server.xml (the /S install does not create it) ----
- name: Install the plain-HTTP server.xml (:{{ alpha_teamcity_port }})
  ansible.windows.win_copy:
    src: server.xml
    dest: "{{ alpha_teamcity_install_dir }}\\conf\\server.xml"

- name: Allow inbound TeamCity :{{ alpha_teamcity_port }}
  community.windows.win_firewall_rule:
    name: "TeamCity {{ alpha_teamcity_port }}"
    localport: "{{ alpha_teamcity_port }}"
    direction: in
    action: allow
    protocol: tcp
    enabled: true
    state: present

# ---- 3. ship the supply-chain C# project + deploy-hook patch to disk ----
- name: Ensure the project directory exists
  ansible.windows.win_file:
    path: "{{ alpha_teamcity_project_dest }}"
    state: directory

- name: Copy the buildable C# project (clean state) to XY1-ALPHA
  ansible.windows.win_copy:
    src: PaymentService/
    dest: "{{ alpha_teamcity_project_dest }}\\"

- name: Copy the MSBuild locator helper (build.cmd)
  ansible.windows.win_copy:
    src: build.cmd
    dest: "{{ alpha_teamcity_project_dest }}\\build.cmd"

# Shipped but NOT applied — the artifact the attacker commits/applies during M8.1.
# Applying + building it under the DA build agent == Domain Admin.
- name: Stage the deploy-hook patch (NOT applied; the attacker applies it)
  ansible.windows.win_copy:
    src: deploy/
    dest: "{{ alpha_teamcity_project_dest }}\\deploy\\"

# ---- 4. bring up the server (service install + first-run wizard + admin + build config) ----
- name: Copy the server setup script
  ansible.windows.win_copy:
    src: setup_teamcity.ps1
    dest: "{{ alpha_teamcity_install_dir }}\\setup_teamcity.ps1"

- name: Run the server setup (service, wizard, EULA, admin, project + build config)
  ansible.windows.win_shell: >-
    & '{{ alpha_teamcity_install_dir }}\setup_teamcity.ps1'
    -InstallDir '{{ alpha_teamcity_install_dir }}'
    -Port {{ alpha_teamcity_port }}
    -SvcUser '{{ alpha_teamcity_server_svc_user }}'
    -SvcPass '{{ alpha_teamcity_server_svc_password }}'
    -AdminUser '{{ alpha_teamcity_admin_user }}'
    -AdminPass '{{ alpha_teamcity_admin_password }}'
    -ProjectName '{{ alpha_teamcity_project_id }}'
    -BuildCmd '{{ alpha_teamcity_project_dest }}\build.cmd'
  register: tc_setup
  changed_when: "'server setup complete' in tc_setup.stdout"

# ---- 5. build agent runs as the DA service account ----
- name: Grant the build service account "Log on as a service"
  ansible.windows.win_user_right:
    name: SeServiceLogonRight
    users:
      - "{{ alpha_teamcity_agent_user }}"
    action: add

- name: Copy the agent setup script
  ansible.windows.win_copy:
    src: setup_agent.ps1
    dest: "{{ alpha_teamcity_install_dir }}\\setup_agent.ps1"

- name: Run the agent setup (scheduled task as the DA account + authorize)
  ansible.windows.win_shell: >-
    & '{{ alpha_teamcity_install_dir }}\setup_agent.ps1'
    -InstallDir '{{ alpha_teamcity_install_dir }}'
    -Port {{ alpha_teamcity_port }}
    -AgentName '{{ alpha_teamcity_agent_name }}'
    -AgentUser '{{ alpha_teamcity_agent_user }}'
    -AgentPass '{{ alpha_teamcity_agent_password }}'
  register: tc_agent
  changed_when: false
